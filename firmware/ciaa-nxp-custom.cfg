###############################################################################
# OpenOCD configuration personalizada para CIAA-NXP
# Basada en ciaa-nxp.cfg con sintaxis actualizada de OpenOCD
###############################################################################

######################################################################################################
# Interface FTDI (sintaxis moderna)
######################################################################################################
adapter driver ftdi

######################################################################################################
# VID-PID del FTDI
######################################################################################################
ftdi vid_pid 0x0403 0x6010

######################################################################################################
# OPCIONAL: Descomentar para seleccionar un adaptador específico por número de serie
# Ejecutar 'lsusb -v -d 0403:6010 | grep iSerial' para encontrar tu número de serie
######################################################################################################
# adapter serial "TU_NUMERO_SERIE_AQUI"

######################################################################################################
# OPCIONAL: Descomentar para seleccionar por ubicación USB (bus:puerto)
# Bus 001, Port 003 -> ubicación "1-3"
######################################################################################################
adapter usb location 1-3

######################################################################################################
# Channel A (ADBUS0 a ADBUS3) para JTAG mediante MPSSE
######################################################################################################
ftdi channel 0

######################################################################################################
# Configuración GPIO y señales JTAG
######################################################################################################
ftdi layout_init 0x0708 0xFFFB
ftdi layout_signal nTRST -data 0x0100
ftdi layout_signal nSRST -data 0x0200

################################################################
# Frecuencia del JTAG (TCK)
# 2000 KHz = 2 MHz (por defecto)
# Reducir si hay problemas de conexión (ej: 1000, 500)
################################################################
transport select jtag
adapter speed 500

################################################################
# Definición del CHIP
################################################################
set _CHIPNAME lpc4337

################################################################
# TAP IDs del JTAG
################################################################
set _M4_JTAG_TAPID 0x4ba00477
set _M0_JTAG_TAPID 0x0ba01477

################################################################
# Configuración de TAPs del JTAG
################################################################
jtag newtap $_CHIPNAME m4 -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_M4_JTAG_TAPID
jtag newtap $_CHIPNAME m0 -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_M0_JTAG_TAPID

################################################################
# Crear DAPs (Debug Access Port) para cada core
################################################################
dap create $_CHIPNAME.m4.dap -chain-position $_CHIPNAME.m4
dap create $_CHIPNAME.m0.dap -chain-position $_CHIPNAME.m0

################################################################
# Targets Cortex-M4 y Cortex-M0 (usando -dap en lugar de -chain-position)
################################################################
target create $_CHIPNAME.m4 cortex_m -dap $_CHIPNAME.m4.dap
target create $_CHIPNAME.m0 cortex_m -dap $_CHIPNAME.m0.dap

################################################################
# Área de trabajo en RAM
################################################################
set _WORKAREASIZE 0x8000
$_CHIPNAME.m4 configure -work-area-phys 0x10000000 -work-area-size $_WORKAREASIZE

################################################################
# Banco de Flash - SIN auto_erase ni unlock (controlado manualmente)
################################################################
set _FLASHNAME $_CHIPNAME.flash
flash bank $_FLASHNAME lpc2000 0x1a000000 0x80000 0 0 $_CHIPNAME.m4 lpc4300 96000 calc_checksum

################################################################
# Configuración de Reset
################################################################
reset_config none
cortex_m reset_config vectreset

################################################################
# Seleccionar target por defecto
################################################################
targets $_CHIPNAME.m4

################################################################
# Evento al conectar GDB
################################################################
$_CHIPNAME.m4 configure -event gdb-attach {
   echo "Reset Halt, debido a GDB conectado..."
   reset halt
}

################################################################
# Evento antes de reset para preparar el target
################################################################
$_CHIPNAME.m4 configure -event reset-init {
   echo "Configurando target después de reset..."
   # Deshabilitar watchdog si está activo
   mww 0x40000000 0x0
}